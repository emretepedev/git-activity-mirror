# Project hooks only. Personal Git Activity Mirror wiring lives in
# lefthook-local.yml, which lefthook merges in at runtime (its jobs are
# appended after the ones below).
#
# The top-level `piped: true` is what makes the split safe: the appended
# mirror job runs only if every project job above it succeeds. Without it,
# lefthook would run top-level jobs regardless of earlier failures, so a
# failing lint/test would still trigger the mirror push. Project jobs stay
# parallel by nesting them in a `parallel: true` group.
post-commit:
  piped: true
  jobs:
    - group:
        parallel: true
        jobs:
          - name: example job#1
            run: echo "job_1"

pre-push:
  piped: true
  jobs:
    - group:
        parallel: true
        jobs:
          - name: example job#2
            run: echo "job_2"
          - name: example job#3
            run: echo "job_3"
